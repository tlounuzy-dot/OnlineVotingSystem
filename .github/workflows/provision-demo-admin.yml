name: One-time SecureVote administrator

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Full 40-character commit SHA currently deployed on Render
        required: true
        type: string
      confirmation:
        description: Type CREATE ONE DEMO ADMIN IN securevote_test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: securevote-one-time-admin
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: securevote-admin-provision
    steps:
      - name: Validate reviewed target and confirmation
        env:
          TARGET_SHA: ${{ inputs.deployed_sha }}
          APPROVED_SHA: ${{ vars.SV_DEPLOYED_SHA }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TARGET_SHA" == "$APPROVED_SHA" ]] || exit 1
          [[ "$CONFIRMATION" == 'CREATE ONE DEMO ADMIN IN securevote_test' ]] || exit 1

      - name: Check out reviewed provisioning tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out deployed application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.deployed_sha }}
          path: deployed
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install deployed dependencies without provisioning secrets
        run: |
          python -m pip install --disable-pip-version-check -r deployed/requirements.txt
          python -m pip check

      - name: Verify target and create one application administrator
        working-directory: deployed
        env:
          SV_PROVISION_HOST: ${{ secrets.SV_AIVEN_HOST }}
          SV_PROVISION_DB_PASSWORD: ${{ secrets.SV_AIVEN_PASSWORD }}
          SV_PROVISION_CA_PEM: ${{ secrets.SV_AIVEN_CA_PEM }}
          SV_PROVISION_EMAIL: ${{ secrets.SV_ADMIN_EMAIL }}
          SV_PROVISION_PASSWORD: ${{ secrets.SV_ADMIN_PASSWORD }}
          SV_PROVISION_CONFIRMATION: ${{ inputs.confirmation }}
          SV_PROVISION_EXPECTED_SHA: ${{ inputs.deployed_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python ../tooling/scripts/provision_demo_admin.py
