<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
</head>
<body>
    <main>
        <h1>Login</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <p>
                    {{ field.label_tag }}<br>
                    {{ field }}
                    {% for error in field.errors %}
                        <span>{{ error }}</span>
                    {% endfor %}
                </p>
            {% endfor %}
            <button type="submit">Login</button>
        </form>
        <p><a href="{% url 'accounts:register' %}">Register as a voter</a></p>
    </main>
</body>
</html>
