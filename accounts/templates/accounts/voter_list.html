{% extends 'base.html' %}{% block content %}<h1>Manage voters</h1><form><label for="q">Search voters</label><input id="q" name="q" value="{{ query }}"><button>Search</button></form><table><tr><th>Name</th><th>Email</th><th>Status</th><th>Action</th></tr>{% for voter in voters %}<tr><td>{{ voter.user.full_name }}</td><td>{{ voter.user.email }}</td><td>{{ voter.get_status_display }}</td><td><form method="post" action="{% url 'accounts:voter_status' voter.pk %}">{% csrf_token %}<select name="status"><option value="verified">Activate</option><option value="pending">Suspend</option><option value="rejected">Reject</option></select><button>Update</button></form></td></tr>{% endfor %}</table>{% endblock %}
