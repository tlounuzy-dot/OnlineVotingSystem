{% extends 'base.html' %}{% block content %}<h1>Candidates</h1><a href="{% url 'elections:candidate_create' %}">Add candidate</a><table><tr><th>Name</th><th>Election</th><th>Status</th><th></th></tr>{% for candidate in candidates %}<tr><td>{{ candidate.full_name }}</td><td>{{ candidate.election.title }}</td><td>{{ candidate.get_status_display }}</td><td><a href="{% url 'elections:candidate_edit' candidate.pk %}">Edit</a><form method="post" action="{% url 'elections:candidate_deactivate' candidate.pk %}">{% csrf_token %}<button>Deactivate</button></form></td></tr>{% endfor %}</table>{% endblock %}
