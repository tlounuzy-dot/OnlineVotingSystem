{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Elections</h1><a class="btn btn-primary" href="{% url 'elections:create' %}">Create election</a></div><table class="table"><tr><th>Title</th><th>Status</th><th>Dates</th><th></th></tr>{% for e in elections %}<tr><td>{{ e.title }}</td><td>{{ e.calculated_status }}</td><td>{{ e.start_date }}–{{ e.end_date }}</td><td><a href="{% url 'elections:detail' e.pk %}">Manage</a></td></tr>{% endfor %}</table>{% endblock %}
