{% extends 'base.html' %}{% block content %}<h1>Audit logs</h1><table><tr><th>When</th><th>User</th><th>Action</th><th>Description</th></tr>{% for log in logs %}<tr><td>{{ log.created_at }}</td><td>{{ log.user|default:'System' }}</td><td>{{ log.action }}</td><td>{{ log.description }}</td></tr>{% endfor %}</table>{% endblock %}
