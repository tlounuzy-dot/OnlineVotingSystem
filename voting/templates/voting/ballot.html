{% extends 'base.html' %}{% block content %}<h1>{{ election.title }}</h1><p>Select one active candidate. Your vote is submitted only after confirmation.</p><form method="post" action="{% url 'voting:choose' election.pk %}">{% csrf_token %}{% for candidate in candidates %}<label class="card d-block mb-2 p-3"><input type="radio" name="candidate" value="{{ candidate.pk }}" required> <strong>{{ candidate.full_name }}</strong> — {{ candidate.party }}<span class="d-block text-muted">{{ candidate.manifesto }}</span></label>{% empty %}<p>No candidates are available.</p>{% endfor %}<button class="btn btn-primary" {% if not candidates %}disabled{% endif %}>Continue to confirmation</button><a class="btn btn-link" href="{% url 'elections:voter_dashboard' %}">Cancel</a></form>{% endblock %}
