{% extends 'base.html' %}{% block content %}<h1>Confirm your vote</h1><div class="card"><div class="card-body"><p><strong>Election:</strong> {{ election.title }}</p><p><strong>Candidate:</strong> {{ candidate.full_name }} — {{ candidate.party }}</p><p class="text-danger">Once submitted, your vote cannot be changed.</p><form method="post" action="{% url 'voting:submit' election.pk %}">{% csrf_token %}<button class="btn btn-danger">Confirm and submit vote</button><a class="btn btn-link" href="{% url 'voting:ballot' election.pk %}">Back</a></form></div></div>{% endblock %}
